services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: agentdesk, POSTGRES_PASSWORD: agentdesk, POSTGRES_DB: agentdesk}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U agentdesk"], interval: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://agentdesk:agentdesk@db:5432/agentdesk
      CHECKPOINT_URL: postgresql://agentdesk:agentdesk@db:5432/agentdesk
      REDIS_URL: redis://redis:6379/0
      VECTOR_BACKEND: pgvector
      SERVICE_BASE_URL: http://localhost:8000
    ports: ["8003:8000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
volumes:
  pgdata:
  redisdata:
