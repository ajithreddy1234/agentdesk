<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentDesk</title>
<style>
  :root { --bg:#f6f6f3; --panel:#fff; --line:#e3e3de; --text:#1c1c1a; --muted:#6c6c66; --accent:#1f6f50; --soft:#e6f2ec; --warn:#9a5b00; --warnbg:#fdf3e1; }
  * { box-sizing:border-box } body { margin:0; font:15px/1.5 Inter,system-ui,sans-serif; color:var(--text); background:var(--bg) }
  .app { display:grid; grid-template-columns: 1fr 380px; height:100vh }
  header { display:flex; gap:12px; align-items:center; padding:14px 22px; border-bottom:1px solid var(--line); background:var(--panel) }
  header h1 { font-size:18px; margin:0 12px 0 0 } select, input, button { font:inherit }
  select, input[type=text] { border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:#fff }
  button { border:0; border-radius:8px; padding:8px 14px; background:var(--accent); color:#fff; cursor:pointer } button.ghost { background:none; color:var(--accent); padding:4px 8px }
  button:disabled { opacity:.5 } .chat { display:flex; flex-direction:column; min-width:0 }
  #log { flex:1; overflow-y:auto; padding:24px max(22px, calc((100% - 760px)/2)) }
  .msg { margin:0 0 14px } .msg .bubble { display:inline-block; padding:10px 14px; border-radius:12px; max-width:85%; white-space:pre-wrap }
  .user { text-align:right } .user .bubble { background:var(--soft) } .assistant .bubble { background:var(--panel); border:1px solid var(--line) }
  .awaiting .bubble { background:var(--warnbg); border-color:#f0d9a8 }
  .tools { font-size:12px; color:var(--muted); margin-top:4px } .tools code { background:#eee; padding:1px 5px; border-radius:4px; margin-right:4px }
  form { display:flex; gap:8px; padding:14px max(22px, calc((100% - 760px)/2)); border-top:1px solid var(--line); background:var(--panel) } form input { flex:1 }
  aside { border-left:1px solid var(--line); background:var(--panel); padding:18px; overflow-y:auto }
  aside h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px }
  .card { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px } .card .amt { font-size:20px; font-weight:600 }
  .card ul { padding-left:18px; margin:6px 0 } .muted { color:var(--muted); font-size:13px } .row { display:flex; gap:8px; margin-top:8px }
  .reject { background:#a23b2a }
</style>
</head>
<body>
<div class="app">
  <section class="chat">
    <header>
      <h1>AgentDesk</h1>
      <label class="muted">Customer</label>
      <select id="customer"></select>
      <input id="cpass" type="password" placeholder="password (demo: demo-customer)" style="width:220px">
      <button id="clogin">Sign in</button>
      <span class="muted" id="cstatus">Not signed in</span>
      <button class="ghost" id="newchat">New conversation</button>
      <span class="muted" id="meta"></span>
    </header>
    <div id="log"></div>
    <form id="form"><input id="input" type="text" placeholder="e.g. The paneer in my last order was spoiled" autocomplete="off"><button id="send">Send</button></form>
  </section>
  <aside>
    <h2>Supervisor approvals</h2>
    <div class="muted" style="margin-bottom:10px">
      <input id="reviewer" type="text" value="supervisor" style="width:110px;padding:3px 6px">
      <input id="spass" type="password" placeholder="password" style="width:110px;padding:3px 6px">
      <button id="slogin" style="padding:4px 10px">Sign in</button>
      <div id="sstatus" style="margin-top:6px">Supervisor not signed in (demo password: demo-supervisor)</div>
    </div>
    <div id="approvals"><p class="muted">No refunds waiting.</p></div>
  </aside>
</div>
<script>
const $ = (id) => document.getElementById(id);
let thread = null;
let ctoken = sessionStorage.getItem("ad_ctoken"), stoken = sessionStorage.getItem("ad_stoken");
const auth = (t) => (t ? { Authorization: "Bearer " + t } : {});
async function errText(r) { const b = await r.json().catch(() => ({})); const d = b.detail; return typeof d === "string" ? d : (d && d.message) || r.statusText; }

function add(role, text, extra = {}) {
  const d = document.createElement("div");
  d.className = `msg ${role} ${extra.status === "awaiting_approval" ? "awaiting" : ""}`;
  const b = document.createElement("div"); b.className = "bubble"; b.textContent = text; d.appendChild(b);
  if (extra.tools && extra.tools.length) {
    const t = document.createElement("div"); t.className = "tools";
    t.innerHTML = "Tools: " + extra.tools.map((c) => `<code>${c.name}</code>`).join("");
    d.appendChild(t);
  }
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
}

async function loadCustomers() {
  const cs = await fetch("/demo/customers").then((r) => r.json());
  $("customer").innerHTML = cs.map((c) => `<option value="${c.id}">#${c.id} ${c.name} (${c.city})</option>`).join("");
}

async function send(e) {
  e.preventDefault();
  const text = $("input").value.trim(); if (!text) return;
  $("input").value = ""; $("send").disabled = true; add("user", text);
  try {
    if (!ctoken) throw new Error("Sign in as a customer first.");
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json", ...auth(ctoken) },
      body: JSON.stringify({ message: text, thread_id: thread }) });
    if (!r.ok) throw new Error(await errText(r));
    const data = await r.json();
    thread = data.thread_id;
    add("assistant", data.reply, { tools: data.tool_calls, status: data.status });
    $("meta").textContent = `${(data.latency_ms / 1000).toFixed(1)} s · ${data.tokens.input + data.tokens.output} tokens`;
    refreshApprovals();
  } catch (err) { add("assistant", "Error: " + err.message); }
  finally { $("send").disabled = false; $("input").focus(); }
}

async function refreshApprovals() {
  if (!stoken) { $("approvals").innerHTML = '<p class="muted">Sign in as a supervisor to review refunds.</p>'; return; }
  const resp = await fetch("/approvals", { headers: auth(stoken) });
  if (!resp.ok) { $("approvals").innerHTML = `<p class="muted">${await errText(resp)}</p>`; return; }
  const list = await resp.json();
  if (!list.length) { $("approvals").innerHTML = '<p class="muted">No refunds waiting.</p>'; return; }
  $("approvals").innerHTML = list.map((a) => `
    <div class="card">
      <div class="amt">Rs ${a.refund.amount.toFixed(2)}</div>
      <div class="muted">Customer #${a.customer_id} · order ${a.refund.order_id} · ${a.refund.reason}</div>
      <ul>${a.refund.lines.map((l) => `<li>${l.qty} × ${l.name} (Rs ${l.amount.toFixed(2)})</li>`).join("")}</ul>
      <div class="muted">${a.refund.approval_reason || ""}</div>
      <div class="row"><button onclick="decide('${a.thread_id}', true)">Approve</button><button class="reject" onclick="decide('${a.thread_id}', false)">Reject</button></div>
    </div>`).join("");
}

async function decide(tid, approved) {
  const note = approved ? "Verified" : prompt("Reason for rejecting?") || "Not approved";
  const resp = await fetch(`/approvals/${tid}`, { method: "POST", headers: { "Content-Type": "application/json", ...auth(stoken) },
    body: JSON.stringify({ approved, note }) });
  if (!resp.ok) { alert(await errText(resp)); refreshApprovals(); return; }
  const r = await resp.json();
  if (tid === thread) add("assistant", r.reply, { tools: r.tool_calls });
  refreshApprovals();
}

$("clogin").addEventListener("click", async () => {
  const r = await fetch("/auth/customer", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ customer_id: Number($("customer").value), password: $("cpass").value }) });
  if (!r.ok) { $("cstatus").textContent = await errText(r); return; }
  ctoken = (await r.json()).token; sessionStorage.setItem("ad_ctoken", ctoken);
  $("cstatus").textContent = "Signed in as customer #" + $("customer").value; thread = null; $("log").innerHTML = "";
});
$("slogin").addEventListener("click", async () => {
  const r = await fetch("/auth/supervisor", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("reviewer").value, password: $("spass").value }) });
  if (!r.ok) { $("sstatus").textContent = await errText(r); return; }
  stoken = (await r.json()).token; sessionStorage.setItem("ad_stoken", stoken);
  $("sstatus").textContent = "Signed in as " + $("reviewer").value; refreshApprovals();
});
fetch("/health").then((r) => r.json()).then((h) => { if (!h.llm_configured) add("assistant", "No LLM API key configured: set OPENROUTER_API_KEY in .env and restart. Sign-in, orders and approvals still work."); });
$("form").addEventListener("submit", send);
$("newchat").addEventListener("click", () => { thread = null; $("log").innerHTML = ""; });
$("customer").addEventListener("change", () => { thread = null; $("log").innerHTML = ""; ctoken = null; sessionStorage.removeItem("ad_ctoken"); $("cstatus").textContent = "Not signed in"; });
loadCustomers(); refreshApprovals(); setInterval(refreshApprovals, 5000);
</script>
</body>
</html>
