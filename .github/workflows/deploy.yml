name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing ECR image tag for rollback (empty builds this commit)
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EMBEDDING_BACKEND: hash
      TEST_POSTGRES_URL: postgresql+psycopg2://postgres:pg@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: pg
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_URL: ${{ vars.APP_URL }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate image tag
        run: |
          python - <<'PY'
          import os, re
          if not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}', os.environ['IMAGE_TAG']):
              raise SystemExit('image_tag must be a Docker image tag, not a URI or digest')
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
        if: inputs.image_tag == ''
      - uses: docker/build-push-action@v6
        if: inputs.image_tag == ''
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy through SSM
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, shlex
          from pathlib import Path
          q = shlex.quote
          registry = os.environ['ECR_REGISTRY']
          image = f"{registry}/{os.environ['ECR_REPOSITORY']}:{os.environ['IMAGE_TAG']}"
          script = '\n'.join([
              '#!/bin/bash',
              'set -euo pipefail',
              'cd /opt/agentdesk',
              f"aws ecr get-login-password --region {q(os.environ['AWS_REGION'])} | docker login --username AWS --password-stdin {q(registry)}",
              f'export IMAGE={q(image)}',
              'docker compose -f docker-compose.prod.yml pull app && docker compose -f docker-compose.prod.yml up -d',
              # Save the deployed image for subsequent maintenance commands.
              'printf "%s\\n" "$IMAGE" > .deployed-image',
          ])
          # AWS-RunShellScript uses /bin/sh: explicitly run Bash for pipefail.
          command = 'bash -c ' + q(script)
          Path('/tmp/agentdesk-ssm.json').write_text(json.dumps({
              'commands': [command], 'executionTimeout': ['1800'],
          }))
          PY
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters file:///tmp/agentdesk-ssm.json \
            --timeout-seconds 600 \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          # The built-in waiter only waits ~100s; image pulls can take longer.
          deadline=$((SECONDS + 2100))
          while true; do
            aws ssm wait command-executed --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" || true
            aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" > /tmp/agentdesk-invocation.json
            status=$(python -c 'import json; print(json.load(open("/tmp/agentdesk-invocation.json"))["Status"])')
            case "$status" in
              Pending|InProgress|Delayed)
                if (( SECONDS < deadline )); then continue; fi
                echo "::error::SSM command exceeded the deployment deadline"
                ;;
            esac
            break
          done
          python - <<'PY'
          import json
          with open('/tmp/agentdesk-invocation.json') as f:
              result = json.load(f)
          print('Status:', result['Status'])
          print('STDOUT:\n' + result.get('StandardOutputContent', ''))
          print('STDERR:\n' + result.get('StandardErrorContent', ''))
          if result['Status'] != 'Success':
              raise SystemExit(1)
          PY
      - name: Smoke-check HTTPS health
        run: curl -fsS --retry 20 --retry-all-errors --retry-delay 10 --connect-timeout 10 --max-time 20 "https://${APP_URL}/health"
