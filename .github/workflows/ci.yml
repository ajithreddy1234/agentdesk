name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EMBEDDING_BACKEND: hash
      TEST_POSTGRES_URL: postgresql+psycopg2://postgres:pg@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: pg
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agentdesk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  eval:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      EMBEDDING_BACKEND: hash
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST || 'https://cloud.langfuse.com' }}
    steps:
      - name: Check eval credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$OPENROUTER_API_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping eval: OPENROUTER_API_KEY is not configured."
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.credentials.outputs.enabled == 'true'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - if: steps.credentials.outputs.enabled == 'true'
        run: pip install -r requirements.txt
      - name: Run 120-scenario eval
        id: run_eval
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          echo "ran=true" >> "$GITHUB_OUTPUT"
          python -m eval.run_eval --tag ci
      - name: Triage failures
        if: steps.run_eval.outcome == 'success'
        run: python -m eval.triage ci --md eval/results/triage.md
      - name: Enforce eval thresholds
        if: ${{ !cancelled() && steps.run_eval.outcome == 'success' }}
        run: python .github/scripts/eval_gate.py eval/results/ci.json
      - name: Update sticky eval comment
        if: ${{ always() && steps.run_eval.outputs.ran == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'eval/results/ci.md';
            if (!fs.existsSync(path)) {
              core.warning('Eval did not produce a report; inspect the job logs/artifact.');
              return;
            }
            const marker = '<!-- agentdesk-eval -->';
            const body = `${marker}\n${fs.readFileSync(path, 'utf8')}`;
            const params = {...context.repo, issue_number: context.issue.number};
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const existing = comments.find(c => c.user.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({...params, body});
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/
          if-no-files-found: ignore
