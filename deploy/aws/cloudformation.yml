AWSTemplateFormatVersion: '2010-09-09'
Description: AgentDesk on Ubuntu EC2 with ECR, GitHub OIDC, SSM, Caddy TLS, and CloudWatch logs.

Parameters:
  GitHubRepo:
    Type: String
    Description: GitHub repository owner/name (case-sensitive)
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
  InstanceType:
    Type: String
    Default: t3.small
    Description: An x86_64 EC2 instance type
  DomainName:
    Type: String
    Description: Public DNS hostname for Caddy TLS (without https:// or a path)
    AllowedPattern: '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?\.[A-Za-z]{2,}$'
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set false if token.actions.githubusercontent.com already exists in this account
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Conditions:
  ShouldCreateOidcProvider:
    Fn::Equals: [{Ref: CreateOidcProvider}, 'true']

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: {Ref: Vpc}
      InternetGatewayId: {Ref: InternetGateway}
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: Vpc}
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: {Ref: Vpc}
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: {Ref: RouteTable}
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: {Ref: InternetGateway}
  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: {Ref: PublicSubnet}
      RouteTableId: {Ref: RouteTable}
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Caddy HTTP/HTTPS only; administration uses SSM, no SSH
      VpcId: {Ref: Vpc}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  EcrRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the last 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /agentdesk
      RetentionInDays: 30
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [{Ref: InstanceRole}]
  Instance:
    Type: AWS::EC2::Instance
    DependsOn: [PublicRoute, SubnetRouteTableAssociation, LogGroup]
    Properties:
      ImageId: {Ref: UbuntuAmi}
      InstanceType: {Ref: InstanceType}
      IamInstanceProfile: {Ref: InstanceProfile}
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: {Ref: PublicSubnet}
          GroupSet: [{Ref: SecurityGroup}]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: {Fn::Sub: '${AWS::StackName}-agentdesk'}
      # Same host setup as bootstrap.sh; no secrets or app files in UserData.
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/usr/bin/env bash
            set -- '${DomainName}' '${AWS::Region}' '/agentdesk'
            # Keep CloudFormation UserData in sync with this script.
            set -euo pipefail

            if [[ $# -ne 3 ]]; then
              echo "Usage: sudo bash $0 <domain> <region> <log-group>" >&2
              exit 2
            fi
            if [[ $EUID -ne 0 ]]; then
              echo "Run this script as root (sudo)." >&2
              exit 2
            fi
            domain=$1
            region=$2
            log_group=$3
            if [[ ! $domain =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] || [[ $domain != *.* ]]; then
              echo "domain must be a DNS hostname without a scheme or path" >&2
              exit 2
            fi
            if [[ ! $region =~ ^[a-z]{2}(-[a-z]+)+-[0-9]+$ ]] || [[ ! $log_group =~ ^[A-Za-z0-9/_.#-]+$ ]]; then
              echo "Invalid AWS region or CloudWatch log group" >&2
              exit 2
            fi
            . /etc/os-release
            if [[ $ID != ubuntu ]] || [[ $(dpkg --print-architecture) != amd64 ]]; then
              echo "This setup requires Ubuntu amd64." >&2
              exit 2
            fi
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ca-certificates curl gnupg unzip python3

            # Docker's official repository includes the Compose v2 plugin.
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc
            printf 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu %s stable\n' "$VERSION_CODENAME" > /etc/apt/sources.list.d/docker.list

            # Caddy's official stable repository supplies its systemd service.
            curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor --yes -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
            curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt -o /etc/apt/sources.list.d/caddy-stable.list
            chmod a+r /usr/share/keyrings/caddy-stable-archive-keyring.gpg /etc/apt/sources.list.d/caddy-stable.list
            apt-get update
            apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin caddy

            # AWS CLI v2; skip installation on subsequent runs.
            if ! command -v aws >/dev/null 2>&1 || [[ $(aws --version 2>&1) != aws-cli/2.* ]]; then
              setup_tmp=$(mktemp -d)
              trap 'rm -rf "$setup_tmp"' EXIT
              curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o "$setup_tmp/awscliv2.zip"
              unzip -q "$setup_tmp/awscliv2.zip" -d "$setup_tmp"
              "$setup_tmp/aws/install" --update
            fi

            # Ubuntu EC2 images normally include SSM Agent; handle an existing host too.
            if systemctl list-unit-files amazon-ssm-agent.service --no-legend | grep -q '^amazon-ssm-agent'; then
              systemctl enable --now amazon-ssm-agent
            else
              if ! command -v snap >/dev/null 2>&1; then apt-get install -y snapd; fi
              if ! snap list amazon-ssm-agent >/dev/null 2>&1; then
                snap install amazon-ssm-agent --classic
              fi
              snap start --enable amazon-ssm-agent
            fi

            install -d -m 0750 /opt/agentdesk
            install -d -m 0755 /etc/docker
            # Preserve unrelated daemon settings, and restart only when configuration changes.
            docker_config_changed=$(python3 - "$region" "$log_group" <<'PY'
            import json
            import sys
            from pathlib import Path

            path = Path('/etc/docker/daemon.json')
            config = json.loads(path.read_text()) if path.exists() else {}
            previous = json.loads(json.dumps(config))
            config['log-driver'] = 'awslogs'
            config['log-opts'] = {
                'awslogs-region': sys.argv[1],
                'awslogs-group': sys.argv[2],
                'awslogs-create-group': 'false',
                'tag': '{{.Name}}/{{.ID}}',
            }
            if config != previous:
                path.write_text(json.dumps(config, indent=2) + '\n')
            print('true' if config != previous else 'false')
            PY
            )
            if [[ $docker_config_changed == true ]]; then
              dockerd --validate --config-file=/etc/docker/daemon.json
              systemctl restart docker
            fi
            systemctl enable --now docker

            printf '%s {\n    reverse_proxy localhost:8003\n}\n' "$domain" > /etc/caddy/Caddyfile
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            systemctl enable --now caddy
            systemctl reload caddy
            echo "Host setup complete. Copy docker-compose.prod.yml and .env to /opt/agentdesk before deploying."
  PublicIpAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: {Ref: Instance}

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated:
                Fn::If:
                  - ShouldCreateOidcProvider
                  - Ref: GitHubOidcProvider
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  Fn::Sub: repo:${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: PushImageAndDeploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: {Fn::GetAtt: [EcrRepository, Arn]}
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
                  - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: '*'

Outputs:
  EcrRepositoryUri:
    Value: {Fn::GetAtt: [EcrRepository, RepositoryUri]}
  InstanceId:
    Value: {Ref: Instance}
  DeployRoleArn:
    Value: {Fn::GetAtt: [DeployRole, Arn]}
  PublicIp:
    Value: {Ref: PublicIpAddress}
