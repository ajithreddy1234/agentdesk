services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentdesk}
      POSTGRES_DB: agentdesk
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U agentdesk"], interval: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
  app:
    image: ${IMAGE:?set IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://agentdesk:${POSTGRES_PASSWORD:-agentdesk}@db:5432/agentdesk
      CHECKPOINT_URL: postgresql://agentdesk:${POSTGRES_PASSWORD:-agentdesk}@db:5432/agentdesk
      REDIS_URL: redis://redis:6379/0
      VECTOR_BACKEND: pgvector
      SERVICE_BASE_URL: http://localhost:8000
      READONLY_DATABASE_URL: postgresql+psycopg2://agentdesk_reader:${READER_DB_PASSWORD:-agentdesk_reader}@db:5432/agentdesk
      READER_DB_PASSWORD: ${READER_DB_PASSWORD:-agentdesk_reader}
    ports: ["127.0.0.1:8003:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
volumes:
  pgdata:
  redisdata:
